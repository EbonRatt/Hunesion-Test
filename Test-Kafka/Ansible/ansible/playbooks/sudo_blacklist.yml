- name: Configure sudo command blacklist for a user
  hosts: targets
  become: true
  gather_facts: false

  vars:
    username: "demo"
    blacklist_commands: []

  tasks:
    - name: Build sudo command spec
      ansible.builtin.set_fact:
        sudo_cmd_spec: "ALL{{ (blacklist_commands | default([])) | map('regex_replace', '^(.*)$', ', !\\1') | join('') }}"

    - name: Write sudoers rule
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ username }}-blacklist"
        content: "{{ username }} ALL=(ALL) {{ sudo_cmd_spec }}\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
