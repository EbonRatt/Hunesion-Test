- name: Change user password on targets
  hosts: targets
  become: true
  gather_facts: false

  vars:
    username: "demo"
    plain_password: "password"

  tasks:
    - name: Check if user exists
      ansible.builtin.command: id "{{ username }}"
      register: user_check
      failed_when: false
      changed_when: false
      no_log: true

    - name: Fail if user does not exist
      ansible.builtin.fail:
        msg: "User '{{ username }}' does not exist on {{ inventory_hostname }}"
      when: user_check.rc != 0

    - name: Update user password
      ansible.builtin.user:
        name: "{{ username }}"
        password: "{{ plain_password | ansible.builtin.password_hash('sha512') }}"
        update_password: always
