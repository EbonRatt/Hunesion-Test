- name: Create user on targets
  hosts: targets
  become: true
  gather_facts: false

  vars:
    # defaults (can be overridden by Go via --extra-vars)
    username: "demo"
    user_shell: "/bin/bash"
    user_groups: []  # Empty by default - only add groups if provided
    plain_password: "password"

  tasks:
    - name: Validate username format
      ansible.builtin.fail:
        msg: "Invalid username format. Username contains invalid characters or spaces: '{{ username }}'"
      when: "' ' in username or username|length == 0"

    - name: Check if user already exists
      ansible.builtin.command: id "{{ username }}"
      register: user_check
      changed_when: false
      failed_when: false
      ignore_errors: true
      no_log: false

    - name: Fail if user already exists
      ansible.builtin.fail:
        msg: "User '{{ username }}' already exists on {{ inventory_hostname }}"
      when: user_check.rc == 0

    - name: Create user account
      ansible.builtin.user:
        name: "{{ username }}"
        shell: "{{ user_shell }}"
        groups: "{{ user_groups | default([]) }}"
        password: "{{ plain_password | ansible.builtin.password_hash('sha512') }}"
        append: true
        state: present