- name: Enable user on targets (re-enable after soft delete)
  hosts: targets
  become: true
  gather_facts: false

  vars:
    # defaults (can be overridden by Go via --extra-vars)
    username: "demo"
    shell: "/bin/bash"  # Default shell to restore, can be overridden

  tasks:
    - name: Check if user exists
      ansible.builtin.command: id "{{ username }}"
      register: user_check
      failed_when: false
      changed_when: false
      no_log: true

    - name: Fail if user does not exist
      ansible.builtin.fail:
        msg: "User '{{ username }}' does not exist on {{ inventory_hostname }}"
      when: user_check.rc != 0

    - name: Unlock user account (enable password login)
      ansible.builtin.command: passwd -u "{{ username }}"
      changed_when: true
      failed_when: false

    - name: Restore user shell (enable login)
      ansible.builtin.user:
        name: "{{ username }}"
        shell: "{{ shell }}"
      changed_when: true
