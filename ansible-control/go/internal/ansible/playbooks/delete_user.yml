- name: Delete user on targets
  hosts: targets
  become: true
  gather_facts: false

  vars:
    # defaults (can be overridden by Go via --extra-vars)
    username: "demo"
    remove_home: false
    force_remove: false

  tasks:
    - name: Check if user exists
      ansible.builtin.command: id "{{ username }}"
      register: user_check
      failed_when: false
      changed_when: false
      no_log: true

    - name: Fail if user does not exist
      ansible.builtin.fail:
        msg: "User '{{ username }}' does not exist on {{ inventory_hostname }}"
      when: user_check.rc != 0

    - name: Delete user account
      ansible.builtin.user:
        name: "{{ username }}"
        state: absent
        remove: "{{ remove_home }}"
        force: "{{ force_remove }}"
