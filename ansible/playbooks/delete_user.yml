- name: Delete user on targets
  hosts: targets
  become: true
  gather_facts: false

  vars:
    # defaults (can be overridden by Go via --extra-vars)
    username: "demo"
    remove_home: false
    force_remove: false

  tasks:
    - name: Delete user account
      ansible.builtin.user:
        name: "{{ username }}"
        state: absent
        remove: "{{ remove_home }}"
        force: "{{ force_remove }}"
