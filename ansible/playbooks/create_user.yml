- name: Create user on targets
  hosts: targets
  become: true
  gather_facts: false

  vars:
    # defaults (can be overridden by Go via --extra-vars)
    username: "demo"
    user_shell: "/bin/bash"
    user_groups: ["sudo"]
    plain_password: "password"

  tasks:
    - name: Create user account
      ansible.builtin.user:
        name: "{{ username }}"
        shell: "{{ user_shell }}"
        groups: "{{ user_groups }}"
        password: "{{ plain_password | ansible.builtin.password_hash('sha512') }}"
        append: true
        state: present